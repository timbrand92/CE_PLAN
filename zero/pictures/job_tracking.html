<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Job tracking in the Manager</title>
<style>
  :root {
    --bg:#f3f5f8; --card:#ffffff; --tint:#f1f4f8; --ink:#1a2330; --mid:#4c5766; --soft:#66717f; --line:#dde2e9;
    --accent:#1e5aa8; --onaccent:#ffffff;
    --amc:#8f5300; --amb:#fff3d9; --amline:#ecd49a;
    --pipe:#2f6fc4; --paper:#f5f7fa; --pitfill:#ffffff; --hatch:#9aa3ad; --lvl:#b3261e;
    --gn:#17692f; --gnb:#e3f4e8; --gnl:#8fc9a0;
    --chg:#d9372c; --slab:#dde1e7; --hi:#e3edfa; --grip:#1e5aa8; --gripline:#ffffff;
  }
  /* DARK-THEME-START */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#141a22; --card:#1e2631; --tint:#283241; --ink:#e7ecf3; --mid:#b9c2ce; --soft:#97a3b2; --line:#35414f;
      --accent:#5aa2f0; --onaccent:#0f1722;
      --amc:#f2bd5e; --amb:#3e3013; --amline:#6a5320;
      --pipe:#5aa2f0; --paper:#2a3340; --pitfill:#2a3340; --hatch:#8793a1; --lvl:#ff9389;
      --gn:#86d9a1; --gnb:#1a3a28; --gnl:#2f6a47;
      --chg:#ff6f61; --slab:#465263; --hi:#2b3f5c; --grip:#8cc0ff; --gripline:#0f1722;
    }
  }
  /* DARK-THEME-END */
  * { box-sizing:border-box; }
  /* Three text sizes: 24 (titles), 16 (sentences), 13 (row names and the last line). */
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 "Segoe UI", Arial, sans-serif; }
  main { max-width:1080px; margin:0 auto; padding:32px 16px 40px; }
  h1 { font-size:24px; font-weight:700; margin:0 0 8px; }
  h2 { font-size:24px; font-weight:600; margin:0 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px; margin:32px 0; box-shadow:0 1px 2px rgba(26,35,48,.04); min-width:0; }
  .row { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--soft); margin:24px 0 8px; }
  .row.plug { color:var(--accent); font-weight:700; margin-top:32px; }
  .strip { display:grid; gap:16px; align-items:start; }
  .strip.n3 { grid-template-columns:repeat(3, minmax(0,1fr)); }
  .strip.n5 { grid-template-columns:repeat(5, minmax(0,1fr)); gap:12px; }
  .fr { margin:0; min-width:0; }
  .fr figcaption { margin:8px 2px 0; color:var(--ink); }
  .keep { margin:8px 0 0; color:var(--mid); }
  .keep b { font-weight:600; color:var(--ink); }
  .strip + .keep { margin-top:32px; padding-top:16px; border-top:1px solid var(--line); }
  .foot { font-size:13px; color:var(--soft); margin:32px 0 0; text-align:center; }
  @media (max-width:720px) {
    .card { padding:16px 12px; margin:24px 0; }
    .strip.n3 { grid-template-columns:1fr; }
    .strip.n5 { grid-template-columns:1fr 1fr; gap:8px; row-gap:16px; }
  }
  /* pictures: every colour comes from the theme */
  svg { width:100%; height:auto; display:block; }
  svg.pic { background:var(--paper); border-radius:8px; }
  svg text { fill:var(--ink); font-size:14px; }
  .lab { font-family:"Arial Narrow", "Bahnschrift Condensed", Arial, sans-serif; letter-spacing:.02em; }
  .il { fill:var(--lvl) !important; }
  .ui { font-family:"Segoe UI", Arial, sans-serif; }
  svg text.soft { fill:var(--soft); } svg text.b { font-weight:700; } svg text.on { fill:var(--onaccent); font-weight:600; }
  .pb { stroke:var(--pipe); fill:none; }
  .pw { stroke:var(--ink); stroke-width:1; fill:none; }
  .gh { stroke:var(--soft); stroke-width:1; stroke-dasharray:3 3; fill:none; }
  .pit { fill:var(--pitfill); stroke:var(--ink); stroke-width:1.4; }
  .pito { fill:none; stroke:var(--ink); stroke-width:1; stroke-dasharray:4 3; }
  .h { stroke:var(--hatch); stroke-width:1.1; }
  .hon { stroke:var(--mid); stroke-width:.9; fill:none; }
  .dp { fill:var(--chg); stroke:var(--ink); stroke-width:1.2; }
  .tagc { fill:var(--pitfill); stroke:var(--ink); stroke-width:1.2; }
  .sheet { fill:var(--card); stroke:var(--ink); stroke-width:1.2; }
  .panel { fill:var(--card); stroke:var(--line); stroke-width:1.5; }
  .hi { fill:var(--hi); }
  .sel, .btn { fill:var(--accent); }
  .pick { fill:none; stroke:var(--accent); stroke-width:1.4; stroke-dasharray:4 3; }
  .ring { fill:none; stroke:var(--accent); stroke-width:1.6; }
  .ghost { opacity:.32; }
  .cur line { stroke:var(--ink); stroke-width:1.2; } .cur rect { fill:none; stroke:var(--ink); stroke-width:1.2; }
  .act { fill:none; stroke:var(--accent); stroke-width:2.2; } .mka { fill:var(--accent); }
  .fa { fill:none; stroke:var(--ink); stroke-width:1.2; } .mkh { fill:var(--ink); }
  .grip { fill:var(--grip); stroke:var(--gripline); stroke-width:1.2; }
  .join { fill:var(--accent); stroke:var(--paper); stroke-width:1.5; }
  .caret { stroke:var(--accent); stroke-width:2; }
  .slab { fill:var(--slab); stroke:var(--ink); stroke-width:1; } .slab.ol { stroke-width:.8; }
  .outl { fill:none; stroke:var(--ink); stroke-width:1.2; }
  .rub { stroke:var(--ink); stroke-width:1; stroke-dasharray:3 3; }
  .vtx { fill:var(--grip); }
  .sc { stroke:var(--ink); stroke-width:1.2; stroke-dasharray:10 3 2 3; }
  .bar { fill:var(--line); } .bar.edit { fill:var(--hi); }
  .lead { stroke:var(--soft); stroke-width:1; stroke-dasharray:2 3; }
  .eye path { fill:var(--card); stroke:var(--ink); stroke-width:1.4; } .eye circle { fill:var(--ink); }
  .amring { fill:var(--amb); stroke:var(--amc); stroke-width:2; stroke-dasharray:6 4; }
  .amtri { fill:var(--amb); stroke:var(--amc); stroke-width:2; stroke-linejoin:round; }
  svg text.amx { fill:var(--amc); font-weight:700; font-size:22px; font-family:"Segoe UI", Arial, sans-serif; }
  svg text.big { font-size:24px; font-weight:700; }
  /* ribbon pictures */
  svg text { font-family:"Segoe UI", Arial, sans-serif; }
  svg text.lab { font-family:"Arial Narrow", "Bahnschrift Condensed", Arial, sans-serif; }
  .tbar { fill:var(--tint); }
  .rib { fill:var(--card); stroke:var(--line); stroke-width:1; }
  .tabon { fill:var(--card); stroke:var(--line); stroke-width:1; }
  .tabce { fill:var(--accent); }
  .tabhov { fill:var(--hi); }
  .bt { fill:var(--tint); stroke:var(--line); stroke-width:1; }
  .bt.ce { stroke:var(--accent); stroke-width:1.4; }
  .bt.off { fill:none; stroke:var(--line); stroke-dasharray:3 3; }
  .bt.hl { fill:var(--accent); stroke:var(--accent); }
  svg text.dis { fill:var(--soft); opacity:.8; }
  .ownp { fill:var(--tint); stroke:var(--line); stroke-width:1; }
  .sep { stroke:var(--line); stroke-width:1; }
  .fade { fill:url(#fadeg); }
  .why { text-align:center; }
  .why h2 { margin-bottom:8px; }
  .pick2 { fill:none; stroke:var(--accent); stroke-width:1.6; stroke-dasharray:5 3; }
  /* naming pictures */
  .cmd { fill:#f7f7f2; stroke:var(--ink); stroke-width:1.2; }
  svg text.cmdt { fill:#1a2330; font-family:Consolas,"Courier New",monospace; font-size:17px; font-weight:700; }
  svg text.mono { font-family:Consolas,"Courier New",monospace; font-size:16px; font-weight:700; }
  svg text.mono.soft { font-weight:400; }
  .pop { fill:var(--card); stroke:var(--ink); stroke-width:1.2; }
  .chipr { fill:var(--tint); stroke:var(--line); stroke-width:1.2; }
  .chipo { fill:var(--tint); stroke:var(--accent); stroke-width:1.4; }
  svg text.amx2 { fill:var(--amc); font-weight:700; font-size:14px; }
  .tip { fill:var(--card); stroke:var(--ink); stroke-width:1.2; }
  .ptr { fill:var(--ink); stroke:var(--paper); stroke-width:1; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 8px; }
  .chip { font-family:Consolas,"Courier New",monospace; font-weight:700; font-size:16px; background:var(--tint); border:1px solid var(--line); border-radius:999px; padding:4px 14px; color:var(--ink); }
  .names h2 { margin-bottom:0; }
  /* job tracking pictures */
  .jc { fill:var(--card); stroke:var(--line); stroke-width:1.4; }
  .jc.am { fill:var(--amb); stroke:var(--amc); stroke-width:1.8; }
  .jc.gn { fill:var(--gnb); stroke:var(--gn); stroke-width:1.6; }
  .jc.sel { stroke:var(--accent); stroke-width:2.6; }
  svg text { font-size:15px; }
  svg text.am { fill:var(--amc); font-weight:700; }
  svg text.gn { fill:var(--gn); font-weight:700; }
  svg text.h3 { font-size:16px; font-weight:700; }
  svg text.hrs { font-size:30px; font-weight:700; }
  svg text.lv { font-size:17px; font-weight:700; }
  .win { fill:var(--card); stroke:var(--ink); stroke-width:1.2; }
  .wbar { fill:var(--tint); }
  .btn2 { fill:var(--accent); stroke:var(--ink); stroke-width:1.2; }
  .clk { fill:var(--card); stroke:var(--ink); stroke-width:2; }
  .clk.off { stroke:var(--soft); }
  .hand { stroke:var(--ink); stroke-width:2.4; stroke-linecap:round; fill:none; }
  .mov { stroke:var(--ink); stroke-width:1.8; stroke-linecap:round; fill:none; }
  .cup { fill:var(--card); stroke:var(--ink); stroke-width:2; stroke-linejoin:round; }
  .steam { stroke:var(--soft); stroke-width:1.8; stroke-linecap:round; fill:none; }
  .rowhi { fill:var(--hi); }
  .rowl { stroke:var(--line); stroke-width:1.2; }
  .tb { fill:var(--card); stroke:var(--ink); stroke-width:1.4; }
  .pill { fill:var(--amb); stroke:var(--amc); stroke-width:1.6; }
  .lead2 { stroke:var(--amc); stroke-width:1.6; fill:none; }
  .sk { stroke:var(--soft); stroke-width:1; fill:none; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mkh" d="M0 0 L10 5 L0 10 Z"/></marker></defs></svg>
<main>
<h1>Job tracking in the Manager</h1>
<section class="card story"><h2>1 · Where each job is up to</h2><div class="strip n3"><figure class="fr"><svg class="pic" viewBox="0 0 340 206" role="img" aria-label="Manager window with three job cards, Job A Drafting, Job B With council, Job C Issued in green"><rect class="win" x="60" y="8" width="220" height="190" rx="6"/><rect class="wbar" x="61" y="9" width="218" height="24" rx="5"/><rect class="wbar" x="61" y="20" width="218" height="13"/><line class="rowl" x1="61" y1="33" x2="279" y2="33"/><text class="b" x="72" y="26">Manager</text><rect class="jc " x="72" y="40" width="196" height="40" rx="8"/><text class="b" x="86" y="66">Job A · Drafting</text><rect class="jc " x="72" y="92" width="196" height="40" rx="8"/><text class="b" x="86" y="118">Job B · With council</text><rect class="jc gn" x="72" y="144" width="196" height="40" rx="8"/><text class="gn" x="86" y="170">Job C · Issued</text></svg><figcaption>One list. Every job shows its stage.</figcaption></figure><figure class="fr"><svg class="pic" viewBox="0 0 340 206" role="img" aria-label="Issue button pressed on a drawing sheet and the Job A card changes from Drafting to Issued"><rect class="sheet" x="8" y="14" width="130" height="128"/><rect class="sk" x="14" y="20" width="118" height="116"/><rect class="tb" x="82" y="112" width="50" height="24"/><line class="rowl" x1="82" y1="124" x2="132" y2="124"/><rect class="pito" x="26" y="53.0" width="28" height="28"/><rect class="pit" x="28" y="55.0" width="24" height="24"/><line class="h" x1="28" y1="55.0" x2="52" y2="79.0"/><line class="h" x1="52" y1="55.0" x2="28" y2="79.0"/><rect class="pito" x="92" y="53.0" width="28" height="28"/><rect class="pit" x="94" y="55.0" width="24" height="24"/><line class="h" x1="94" y1="55.0" x2="118" y2="79.0"/><line class="h" x1="118" y1="55.0" x2="94" y2="79.0"/><line class="pb" x1="52" y1="67.0" x2="94" y2="67.0" stroke-width="6" stroke-dasharray="10 5"/><line class="pw" x1="52" y1="63.0" x2="94" y2="63.0"/><line class="pw" x1="52" y1="71.0" x2="94" y2="71.0"/><rect class="btn2" x="22" y="154" width="102" height="36" rx="6"/><text class="on" x="73" y="177" text-anchor="middle">Issue</text><path class="ptr" transform="translate(108,166) scale(1.3)" d="M0,0 L0,14 L4,10 L8,18 L11,16 L7,8 L13,8 Z"/><path class="fa" d="M130,172 Q226,176 244,124" marker-end="url(#ab)"/><rect class="jc gn" x="176" y="40" width="158" height="80" rx="8"/><text class="h3" x="190" y="70">Job A</text><text class="b" x="190" y="98"><tspan fill="var(--soft)" font-weight="400">Drafting</tspan> → <tspan class="gn">Issued</tspan></text></svg><figcaption>The stage moves when you issue. Nobody types it.</figcaption></figure><figure class="fr"><svg class="pic" viewBox="0 0 340 206" role="img" aria-label="Cursor on the Job B card with an arrow to its opened drawing sheet"><rect class="win" x="8" y="8" width="150" height="190" rx="6"/><rect class="wbar" x="9" y="9" width="148" height="24" rx="5"/><rect class="wbar" x="9" y="20" width="148" height="13"/><line class="rowl" x1="9" y1="33" x2="157" y2="33"/><text class="b" x="20" y="26">Manager</text><rect class="jc " x="18" y="40" width="130" height="46" rx="8"/><text class="b" x="30" y="60">Job A</text><text class="soft" x="30" y="78">Drafting</text><rect class="jc sel" x="18" y="94" width="130" height="46" rx="8"/><text class="b" x="30" y="114">Job B</text><text class="soft" x="30" y="132">With council</text><rect class="jc gn" x="18" y="148" width="130" height="46" rx="8"/><text class="b" x="30" y="168">Job C</text><text class="gn" x="30" y="186">Issued</text><path class="ptr" transform="translate(126,122) scale(1.3)" d="M0,0 L0,14 L4,10 L8,18 L11,16 L7,8 L13,8 Z"/><path class="fa" d="M162,117 L190,117" marker-end="url(#ab)"/><rect class="sheet" x="196" y="30" width="136" height="144"/><rect class="sk" x="202" y="36" width="124" height="132"/><rect class="tb" x="276" y="144" width="50" height="24"/><line class="rowl" x1="276" y1="156" x2="326" y2="156"/><rect class="pito" x="214" y="77.0" width="28" height="28"/><rect class="pit" x="216" y="79.0" width="24" height="24"/><line class="h" x1="216" y1="79.0" x2="240" y2="103.0"/><line class="h" x1="240" y1="79.0" x2="216" y2="103.0"/><rect class="pito" x="286" y="77.0" width="28" height="28"/><rect class="pit" x="288" y="79.0" width="24" height="24"/><line class="h" x1="288" y1="79.0" x2="312" y2="103.0"/><line class="h" x1="312" y1="79.0" x2="288" y2="103.0"/><line class="pb" x1="240" y1="91.0" x2="288" y2="91.0" stroke-width="6" stroke-dasharray="10 5"/><line class="pw" x1="240" y1="87.0" x2="288" y2="87.0"/><line class="pw" x1="240" y1="95.0" x2="288" y2="95.0"/></svg><figcaption>Click a job to open its drawing.</figcaption></figure></div></section><section class="card story"><h2>2 · What was issued, and when</h2><div class="strip n3"><figure class="fr"><svg class="pic" viewBox="0 0 340 206" role="img" aria-label="Title block revision rows showing A, For council, 12 Nov"><text class="soft" x="24" y="32">Title block</text><rect class="tb" x="24" y="44" width="292" height="140"/><line class="rowl" x1="24" y1="79" x2="316" y2="79"/><line class="rowl" x1="24" y1="114" x2="316" y2="114"/><line class="rowl" x1="24" y1="149" x2="316" y2="149"/><text class="b" x="36" y="68">A · For council · 12 Nov</text></svg><figcaption>You issue as you do now.</figcaption></figure><figure class="fr"><svg class="pic" viewBox="0 0 340 206" role="img" aria-label="Job A card listing Rev A For council 12 Nov and Rev B Council comments 20 Nov"><rect class="jc " x="14" y="34" width="312" height="138" rx="8"/><text class="h3" x="30" y="66">Job A</text><text class="" x="30" y="104">Rev A · For council · 12 Nov</text><text class="b" x="30" y="144">Rev B · Council comments · 20 Nov</text></svg><figcaption>The Manager reads the revision rows.</figcaption></figure><figure class="fr"><svg class="pic" viewBox="0 0 340 206" role="img" aria-label="Job A card with the newest revision, Rev B, highlighted on top"><rect class="jc "
