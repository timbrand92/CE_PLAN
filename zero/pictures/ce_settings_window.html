<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CE settings window</title>
<style>
  :root{--win:#2B2D30;--card:#383B40;--inp:#4A4D55;--bd:#4A4D53;--ibd:#8A8E96;
        --text:#ECEDEF;--body:#D2D5DA;--grey:#A9AEB6;--unit:#C8CBD0;--rose:#FF70B3;--dark:#10131A}
  *{box-sizing:border-box}
  html,body{margin:0;background:#1E1F22;font-family:"Segoe UI",Arial,sans-serif;font-size:14px;color:var(--body);overflow:hidden}
  body{padding:20px;font-variant-numeric:tabular-nums}

  .frame{position:relative;width:1280px;height:720px;background:#0F1113;overflow:hidden;box-shadow:0 0 0 2px #3A3D42}
  .strip{position:absolute;left:0;top:0;right:0;height:24px;background:#26282B;color:var(--grey);font-size:12px;line-height:24px;padding:0 12px;border-bottom:1px solid #34373C}
  .bg{position:absolute;left:0;top:24px}

  .win{position:absolute;left:50%;top:50%;width:936px;transform:translate(-50%,-50%);
       background:var(--win);border:1px solid var(--bd);border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.6);
       display:flex;flex-direction:column;overflow:hidden}
  .tb{height:32px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:var(--text);border-bottom:1px solid #202225}
  .tb svg{display:block}
  .wb{display:flex;flex-direction:column;gap:8px;padding:16px}
  .cols{display:flex;gap:8px;align-items:flex-start}
  .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
  .box.w{width:124px}
  .foot{white-space:normal}

  .grey{font-size:12px;color:var(--grey);line-height:16px;white-space:nowrap}
  .card{flex:none;background:var(--card);border-radius:8px;padding:8px 10px;border:1px solid #2F3236}
  .gh{color:var(--text);line-height:20px;height:20px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
  .row{display:flex;align-items:center;gap:8px;height:28px;border-top:1px solid #43464C}
  .gh + .row{border-top:0}
  .nm{flex:1;min-width:0;color:var(--body);white-space:nowrap}
  .box{flex:none;width:100px;height:24px;background:var(--inp);border:1px solid var(--ibd);border-radius:8px;display:flex;align-items:center;padding:0 8px;color:var(--text);gap:8px;white-space:nowrap}
  .box .u{margin-left:auto;color:var(--unit)}
    .tag{border-radius:8px;padding:0 8px;font-size:12px;line-height:18px;white-space:nowrap;border:1px solid var(--ibd);color:var(--unit);background:transparent}
  .ov{flex:none;width:56px;text-align:right}
  .col.l{flex:none;width:476px}
  .col.r .box{width:112px}
  .col.r .box.w{width:128px}
  .nm{display:flex;align-items:center;gap:8px}
  .colh{display:flex;justify-content:flex-end;height:16px;margin:0 0 2px}
  .colh span{width:52px;text-align:right}

  .bar{height:48px;flex:none;border-top:1px solid #202225;display:flex;align-items:center;padding:0 16px;gap:8px}
  .bar .sp{flex:1}
  .btn{height:32px;border:1px solid var(--ibd);border-radius:8px;background:transparent;color:var(--text);padding:0 16px;display:flex;align-items:center;font-size:14px;font-family:inherit;white-space:nowrap}
  .bar .ok{background:var(--rose);color:var(--dark);border-color:var(--rose);min-width:72px;justify-content:center}
  .bar .cn{min-width:72px;justify-content:center}

  .cap{margin:10px 0 0;font-size:14px;color:var(--text);line-height:20px}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="strip">AutoCAD window (made-up)</div>
  <svg class="bg" id="bg"></svg>

  <div class="win">
    <div class="tb"><span>CE settings &middot; this drawing</span>
      <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="#C8CBD0" stroke-width="1.3" fill="none"/></svg></div>

    <div class="wb" id="wb"></div>

    <div class="bar">
      <div class="btn">Back to office values</div>
      <span class="sp"></span>
      <div class="btn cn">Cancel</div><div class="btn ok">OK</div>
    </div>
  </div>
</div>
<p class="cap" id="cap"></p>

<script>
var NS="http://www.w3.org/2000/svg";
function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e}
var CH='<svg width="10" height="6" viewBox="0 0 10 6" style="display:block"><path d="M1 1l4 4 4-4" fill="none" stroke="#C8CBD0" stroke-width="1.5"/></svg>';
/* [name, value, unit, office value if changed, choice list?] */
/* every Stage 1 setting (D-419 item 6), in two columns of groups; r[5] = a wide box for a words value */
var G=[
 ["Pipe text",[["Label, clear of the pipe","75","mm"],["Invert level, from the pit's outer line","200","mm"],["Invert level, furthest it may slide","1,000","mm"]]],
 ["Pit text",[["Pit number, from the pit centre","600","mm","900 mm"],["Pit number, least gap to the pit","150","mm"],["Cover level, off the pit's outer line corner","400","mm"]]],
 ["Starting figures",[["New pipe size","100","mm dia.",0,1],["New pipe material","UPVC","",0,1],["New pipe grade","1 in 100","",0,1],["Drop across a pit","0.02","m"],["Tolerance on levels and cover","5","mm"]]],
 ["Markers and layers",[["Marker, height","1.0","x text height",0,0,1],["Marker, gap","1.0","x text height",0,0,1],["Layer for marks that never print","CE NO PLOT","",0,0,1],["Impervious outline, layer","50CONT","",0,0,1],["Impervious outline, width","70","mm"]]]
];
function card(g,hd){var s='<div class="card"><div class="gh"><span>'+g[0]+'</span>'+(hd?'<span class="grey" style="width:56px;text-align:right;overflow:visible">office value</span>':'')+'</div>';
  g[1].forEach(function(r,i){
    s+='<div class="row"><span class="nm">'+r[0]+(r[3]?'<span class="tag">Changed</span>':'')+'</span><div class="box'+(r[5]?' w':'')+'">'+r[1]+(r[2]?'<span class="u">'+r[2]+'</span>':'')+(r[4]?'<span class="u">'+CH+'</span>':'')+'</div>'+
       '<span class="grey ov">'+(r[3]?r[3]:'&ndash;')+'</span></div>';
  });
  return s+'</div>'}
var h='<div class="grey">These apply to this drawing only. A grey dash means the figure is still the office value.</div>';
h+='<div class="cols"><div class="col l">'+card(G[0],1)+card(G[1])+'</div><div class="col r">'+card(G[2],1)+card(G[3])+'</div></div>';
h+='<div class="grey foot">A change moves nothing by itself: it applies to new text, and to text the tool places again when its part is next changed. Text you moved by hand is never moved.</div><div class="grey foot">A changed tolerance or default pipe is checked against a pipe when that pipe is next changed or its window is opened, never all pipes at once.</div>';
document.getElementById("wb").innerHTML=h;
(function(){var w=document.querySelector(".win").getBoundingClientRect();document.getElementById("cap").textContent="Settings size: "+Math.round(w.width)+" x "+Math.round(w.height)+" in a 1280 x 720 AutoCAD window (fitted to its list)"})();

(function(){var f=document.getElementById("frame"),W=f.clientWidth,H=f.clientHeight-24,s=document.getElementById("bg");
  s.setAttribute("width",W);s.setAttribute("height",H);s.setAttribute("viewBox","0 0 "+W+" "+H);
  var seed=7;function r(){seed=(seed*16807)%2147483647;return seed/2147483647}
  for(var i=0;i<46;i++){var x=r()*W,y=r()*H,w=60+r()*260,h=30+r()*160;
    s.appendChild(el("rect",{x:x,y:y,width:w,height:h,fill:"none",stroke:"#2A2E34","stroke-width":1}));
    s.appendChild(el("line",{x1:x,y1:y,x2:x+w+r()*200,y2:y+(r()-.5)*260,stroke:"#252930","stroke-width":1}))}
  for(var j=0;j<14;j++){var yy=r()*H;s.appendChild(el("line",{x1:0,y1:yy,x2:W,y2:yy+(r()-.5)*120,stroke:"#202328","stroke-width":1}))}})();

setTimeout(function(){var w=document.querySelector(".win").getBoundingClientRect(),bad=[];
  Array.prototype.forEach.call(document.querySelectorAll(".row"),function(r){var nm=r.querySelector(".nm");if(nm.scrollWidth>nm.clientWidth+1)bad.push(nm.textContent)});
  document.body.setAttribute("data-chk",(w.height>680||bad.length)?"problem "+Math.round(w.height)+" "+bad.join(";"):"ok "+Math.round(w.width)+"x"+Math.round(w.height))},50);
</script>
</body>
</html>
